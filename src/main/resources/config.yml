# Configuration du plugin BedwarsPlugin

game:
  countdown-lobby-seconds: 10
  game-duration-minutes: 45
  sudden-death-dragon-height-above-bed: 20
  end-reset-delay-seconds: 10
  delete-confirmation-seconds: 15

lobby:
  # Rayon (en blocs) de la cage invisible construite au-dessus de la map,
  # centrée sur l'emplacement défini par /bd <nom> spec.
  cage-radius: 5
  cage-height: 4

npc:
  # Skin par défaut utilisé pour les PNJ marchand/amélioration si aucun pseudo n'est précisé
  # lors de /bd <nom> shop <shop|upgrade> color <couleur> [pseudo]. Laisser vide = tête neutre
  # (aucun appel réseau), ou mettre un vrai pseudo Minecraft pour un skin réel par défaut.
  default-skin: ""

generators:
  iron-interval-ticks: 20
  gold-interval-ticks: 80
  diamond-interval-seconds: 30
  emerald-interval-seconds: 45
  diamond-interval-seconds-phase2: 20   # à 25 minutes
  emerald-interval-seconds-phase2: 30
  diamond-interval-seconds-phase3: 10   # à 5 minutes
  emerald-interval-seconds-phase3: 15
  diamond-max-per-spawner: 8
  emerald-max-per-spawner: 4
  phase2-minute: 25
  phase3-minute: 5
