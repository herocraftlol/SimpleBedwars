name: BedwarsPlugin
main: com.bedwars.BedwarsPlugin
version: 1.0.11
api-version: '1.21'
author: herocraftlol
description: Plugin BedWars complet et configurable en jeu pour Paper 1.21+. Clonage d arenes (/bd copy), menu d arenes direct (/bd arene gui), shop configurable en jeu, ameliorations d equipe facon Hypixel, PNJ vendeurs a skin de joueur, lobby flottant, pieges, mort subite avec dragons. Aucune dependance externe requise.

commands:
  bd:
    description: Commande principale du plugin Bedwars
    usage: /bd <create|admin|join|...>

permissions:
  bedwars.admin:
    description: Permet de configurer les arènes bedwars
    default: op
  bedwars.join:
    description: Permet de rejoindre une partie bedwars
    default: true
