name: BedwarsPlugin
main: com.bedwars.BedwarsPlugin
version: 1.0.7
api-version: '1.21'
author: Claude
description: Plugin BedWars entièrement configurable en jeu via /bd

commands:
  bd:
    description: Commande principale du plugin Bedwars
    usage: /bd <create|admin|join|...>

permissions:
  bedwars.admin:
    description: Permet de configurer les arènes bedwars
    default: op
  bedwars.join:
    description: Permet de rejoindre une partie bedwars
    default: true
