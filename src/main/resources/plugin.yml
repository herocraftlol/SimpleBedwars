name: BedwarsPlugin
main: com.bedwars.BedwarsPlugin
version: 1.0.17
api-version: '1.21'
author: herocraftlol
description: Plugin BedWars complet et configurable en jeu pour Paper 1.21+. TNT auto-amorcee qui ne casse que les blocs poses par les joueurs, Forge avec plafonds au sol, hologrammes de generateurs, respawn avec compte a rebours, shop et ameliorations configurables. Aucune dependance externe requise.

commands:
  bd:
    description: Commande principale du plugin Bedwars
    usage: /bd <create|admin|join|...>

permissions:
  bedwars.admin:
    description: Permet de configurer les arènes bedwars
    default: op
  bedwars.join:
    description: Permet de rejoindre une partie bedwars
    default: true
